name: docker-smoke

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - script/validate-docker-smoke
      - src/**
      - package.json
      - package-lock.json
      - tsconfig*.json
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: ./script/validate-docker-smoke
