name: ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Validate OpenAPI contract
        run: ruby -ryaml -e 'data = YAML.load_file("specs/001-verification-control-plane/contracts/openapi.yaml"); abort("openapi version mismatch") unless data["openapi"] == "3.1.0"'
      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose README.md docs/**/*.md specs/**/*.md
