name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  verify:
    name: verify + offline harnesses
    runs-on: ubuntu-latest
    # A harness that spawns servers must fail loudly rather than hang a runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'docs/**'
              - 'contracts/**'
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Gate (install, build, lint, typecheck, tests, OpenAPI version)
        run: ./script/cibuild
      - name: Offline harness — local runtime
        run: npm run validate:local-runtime
      - name: Offline harness — simulated provider e2e
        run: npm run validate:provider-e2e
      - name: Offline harness — provider proof-bundle replay
        run: npm run validate:provider-proof-bundle
      - name: Offline harness — agent loop
        run: npm run validate:agent-loop
      - name: Offline harness — Pi extension
        run: npm run validate:pi-extension
      - name: Offline harness — privacy gate
        run: npm run validate:privacy-gate
      - name: Markdown link check
        if: steps.changes.outputs.docs == 'true' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@v2
        with:
          # Self-referencing github.com URLs are excluded: the CI badge and
          # workflow links intermittently fail the checker with an HTTP/2
          # protocol error even though they resolve fine in a browser.
          args: >-
            --no-progress
            --exclude '^https://github\.com/dallascrilley/vouch'
            README.md CONTRIBUTING.md SECURITY.md CHANGELOG.md
            docs/**/*.md contracts/**/*.md
