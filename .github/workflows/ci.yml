name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: ./script/cibuild
      - name: Markdown link check
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose README.md docs/**/*.md specs/**/*.md
